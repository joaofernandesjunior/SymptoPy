<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SymptoPy // Motor Diagnóstico v2</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan:   #00e5ff;
      --green:  #00ff87;
      --red:    #ff2d55;
      --yellow: #ffd60a;
      --purple: #b388ff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #050810; overflow: hidden; }
    body { font-family: 'JetBrains Mono', monospace; color: #b0d4e8; }

    /* grid background */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    /* scanlines */
    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,0,0,0.05) 3px, rgba(0,0,0,0.05) 4px
      );
    }
    #root { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }

    /* ─ animations ─────────────────────────────────────── */
    @keyframes pulse-cyan {
      0%,100% { filter: drop-shadow(0 0 3px var(--cyan))  drop-shadow(0 0 8px var(--cyan)); }
      50%      { filter: drop-shadow(0 0 8px var(--cyan))  drop-shadow(0 0 22px var(--cyan))  drop-shadow(0 0 35px var(--cyan)); }
    }
    @keyframes pulse-green {
      0%,100% { filter: drop-shadow(0 0 4px var(--green)) drop-shadow(0 0 10px var(--green)); }
      50%      { filter: drop-shadow(0 0 10px var(--green)) drop-shadow(0 0 26px var(--green)) drop-shadow(0 0 40px var(--green)); }
    }
    @keyframes pulse-red {
      0%,100% { filter: drop-shadow(0 0 5px var(--red))   drop-shadow(0 0 14px var(--red)); }
      50%      { filter: drop-shadow(0 0 14px var(--red))  drop-shadow(0 0 32px var(--red))  drop-shadow(0 0 50px var(--red)); }
    }
    @keyframes pulse-yellow {
      0%,100% { filter: drop-shadow(0 0 4px var(--yellow)) drop-shadow(0 0 8px var(--yellow)); }
      50%      { filter: drop-shadow(0 0 8px var(--yellow)) drop-shadow(0 0 18px var(--yellow)); }
    }
    @keyframes pulse-purple {
      0%,100% { filter: drop-shadow(0 0 4px var(--purple)) drop-shadow(0 0 8px var(--purple)); }
      50%      { filter: drop-shadow(0 0 8px var(--purple)) drop-shadow(0 0 18px var(--purple)); }
    }
    @keyframes dash-flow { to { stroke-dashoffset: -18; } }
    @keyframes fade-in   { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
    @keyframes blink     { 0%,100% { opacity:1; } 50% { opacity:0; } }
    @keyframes sweep-in  { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0% 0 0); } }

    .npulse-cyan   { animation: pulse-cyan   2s   ease-in-out infinite; }
    .npulse-green  { animation: pulse-green  1.6s ease-in-out infinite; }
    .npulse-red    { animation: pulse-red    1s   ease-in-out infinite; }
    .npulse-yellow { animation: pulse-yellow 2.2s ease-in-out infinite; }
    .npulse-purple { animation: pulse-purple 2.5s ease-in-out infinite; }
    .edge-flow     { animation: dash-flow 0.7s linear infinite; }
    .fade-in       { animation: fade-in  0.25s ease-out both; }
    .blink         { animation: blink    1.1s  step-end infinite; }

    /* ─ buttons ─────────────────────────────────────────── */
    .btn { position:relative; overflow:hidden; border:1px solid; border-radius:3px;
           font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700;
           letter-spacing:.12em; padding:4px 13px; cursor:pointer;
           transition:all .15s ease; user-select:none; }
    .btn::after { content:''; position:absolute; inset:0;
                  background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,.04) 100%); }
    .btn-sim { border-color:rgba(0,229,255,.3); color:rgba(0,229,255,.55); background:rgba(0,229,255,.04); }
    .btn-nao { border-color:rgba(255,45,85,.3);  color:rgba(255,45,85,.55);  background:rgba(255,45,85,.04); }
    .btn-sim:hover,.btn-sim.on {
      border-color:var(--cyan); color:var(--cyan);
      background:rgba(0,229,255,.1);
      box-shadow:0 0 10px rgba(0,229,255,.35), inset 0 0 6px rgba(0,229,255,.08); }
    .btn-nao:hover,.btn-nao.on {
      border-color:var(--red); color:var(--red);
      background:rgba(255,45,85,.1);
      box-shadow:0 0 10px rgba(255,45,85,.35), inset 0 0 6px rgba(255,45,85,.08); }

    ::-webkit-scrollbar { width:3px; }
    ::-webkit-scrollbar-thumb { background:rgba(0,229,255,.2); border-radius:2px; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback, useMemo } = React;

/* ── data ────────────────────────────────────────────────── */
const QS = [
  { id:'rf',    code:'RF', flag:true,  dutch:0,   target:'septica',
    label:'Febre ≥ 38,5°C ou aparência tóxica?',
    hint:'RED FLAG — artrite séptica a excluir primeiro' },
  { id:'mtf1',  code:'Q1', flag:false, dutch:2.5, target:'score',
    label:'1ª articulação MTF afetada (podagra)?',
    hint:'Dutch score  +2,5 pts' },
  { id:'prev',  code:'Q2', flag:false, dutch:2.0, target:'score',
    label:'Ataque articular semelhante prévio?',
    hint:'Dutch score  +2,0 pts' },
  { id:'verm',  code:'Q3', flag:false, dutch:1.0, target:'score',
    label:'Vermelhidão articular presente?',
    hint:'Dutch score  +1,0 pts' },
  { id:'hascv', code:'Q4', flag:false, dutch:1.5, target:'score',
    label:'HAS ou doença cardiovascular?',
    hint:'Dutch score  +1,5 pts' },
  { id:'ini1d', code:'Q5', flag:false, dutch:0.5, target:'score',
    label:'Início do ataque em menos de 24 horas?',
    hint:'Dutch score  +0,5 pts' },
  { id:'urato', code:'Q6', flag:false, dutch:3.5, target:'score',
    label:'Ácido úrico sérico > 5,88 mg/dL?',
    hint:'Dutch score  +3,5 pts  (maior variável individual)' },
];

// SVG viewBox 0 0 720 460
const NODES = {
  root:       { cx:340, cy:52,  w:164, h:38, lines:['ARTRITE AGUDA'],              kind:'root'   },
  septica:    { cx:118, cy:158, w:164, h:38, lines:['ARTRITE SÉPTICA'],            kind:'danger' },
  ps:         { cx: 92, cy:268, w:140, h:38, lines:['⚠ PS URGENTE'],               kind:'emer'   },
  score:      { cx:462, cy:158, w:188, h:38, lines:['DUTCH SCORE 2010'],           kind:'cyan'   },
  provavel:   { cx:262, cy:278, w:162, h:38, lines:['GOTA PROVÁVEL','≥ 8 pts'],    kind:'green'  },
  possivel:   { cx:452, cy:278, w:162, h:38, lines:['GOTA POSSÍVEL','4–7 pts'],    kind:'yellow' },
  improvavel: { cx:638, cy:278, w:160, h:38, lines:['IMPROVÁVEL','< 4 pts'],       kind:'purple' },
  colchicina: { cx:232, cy:398, w:168, h:38, lines:['COLCHICINA 1,2mg','+ ULT'],   kind:'green'  },
  investigar: { cx:450, cy:398, w:168, h:38, lines:['INVESTIGAR','Urato + RX'],    kind:'yellow' },
  ddx:        { cx:628, cy:398, w:158, h:38, lines:['DDX','Pseudogota / AR'],      kind:'purple' },
};

const EDGES = [
  { a:'root',       b:'septica',    lab:'febre / tóxico' },
  { a:'root',       b:'score',      lab:'sem red flags'  },
  { a:'septica',    b:'ps',         lab:'' },
  { a:'score',      b:'provavel',   lab:'' },
  { a:'score',      b:'possivel',   lab:'' },
  { a:'score',      b:'improvavel', lab:'' },
  { a:'provavel',   b:'colchicina', lab:'' },
  { a:'possivel',   b:'investigar', lab:'' },
  { a:'improvavel', b:'ddx',        lab:'' },
];

const KIND = {
  root:   { stroke:'#00e5ff', fill:'#00182a', text:'#00e5ff', glow:'rgba(0,229,255,.2)',   anim:'cyan'   },
  danger: { stroke:'#ff2d55', fill:'#1a0008', text:'#ff4068', glow:'rgba(255,45,85,.28)',  anim:'red'    },
  emer:   { stroke:'#ff2d55', fill:'#1a0008', text:'#ff6080', glow:'rgba(255,45,85,.32)',  anim:'red'    },
  cyan:   { stroke:'#00e5ff', fill:'#001428', text:'#60cfff', glow:'rgba(0,229,255,.15)',  anim:'cyan'   },
  green:  { stroke:'#00ff87', fill:'#001a0d', text:'#00ff87', glow:'rgba(0,255,135,.22)',  anim:'green'  },
  yellow: { stroke:'#ffd60a', fill:'#1a1100', text:'#ffd60a', glow:'rgba(255,214,10,.2)',  anim:'yellow' },
  purple: { stroke:'#b388ff', fill:'#0d0528', text:'#b388ff', glow:'rgba(179,136,255,.2)', anim:'purple' },
};
const EDGE_COL = {
  danger:'#ff2d55', emer:'#ff2d55',
  green:'#00ff87',  yellow:'#ffd60a', purple:'#b388ff', cyan:'#00e5ff', root:'#00e5ff',
};

/* ── logic ───────────────────────────────────────────────── */
function compute(answers) {
  const active = new Set(['root']);
  let score = 2.0; // sexo masculino +2
  let diag  = null;

  if (answers.rf === 'sim') {
    active.add('septica'); active.add('ps');
    diag = { text:'ARTRITE SÉPTICA — PS IMEDIATO', kind:'emer' };
    return { active, score:0, diag };
  }

  if (answers.rf === 'nao') {
    active.add('score');
    QS.forEach(q => { if (!q.flag && answers[q.id] === 'sim') score += q.dutch; });
    const hasQ = QS.some(q => !q.flag && answers[q.id]);
    if (hasQ) {
      if (score >= 8) {
        active.add('provavel'); active.add('colchicina');
        diag = { text:`GOTA PROVÁVEL — Dutch ${score.toFixed(1)}/15 pts`, kind:'green' };
      } else if (score >= 4) {
        active.add('possivel'); active.add('investigar');
        diag = { text:`GOTA POSSÍVEL — Dutch ${score.toFixed(1)}/15 pts`, kind:'yellow' };
      } else {
        active.add('improvavel'); active.add('ddx');
        diag = { text:`GOTA IMPROVÁVEL — Dutch ${score.toFixed(1)}/15 pts`, kind:'purple' };
      }
    }
  }

  return { active, score, diag };
}

/* ── SVG node ────────────────────────────────────────────── */
function SNode({ id, node, on }) {
  const { cx, cy, w, h, lines, kind } = node;
  const c = KIND[kind] || KIND.cyan;
  const x = cx - w/2, y = cy - h/2;

  if (!on) return (
    <g>
      <rect x={x} y={y} width={w} height={h} rx="5"
        fill="#040c16" stroke="rgba(20,50,70,.45)" strokeWidth=".5"/>
      {lines.map((l,i) => (
        <text key={i} x={cx} y={cy+(lines.length===1?5:(i-.5)*13+5)}
          textAnchor="middle" fill="rgba(20,60,85,.5)"
          fontSize={i===0?9:8} fontFamily="JetBrains Mono,monospace"
          fontWeight={i===0?600:300} letterSpacing=".06em">{l}</text>
      ))}
    </g>
  );

  return (
    <g className={`npulse-${c.anim}`} style={{transformOrigin:`${cx}px ${cy}px`}}>
      {/* outer glow */}
      <rect x={x-5} y={y-5} width={w+10} height={h+10} rx="9" fill={c.glow}/>
      {/* body */}
      <rect x={x} y={y} width={w} height={h} rx="5" fill={c.fill} stroke={c.stroke} strokeWidth="1.5"/>
      {/* shimmer strip */}
      <rect x={x+1} y={y+1} width={w-2} height="9" rx="4" fill={`${c.stroke}18`}/>
      {/* corner brackets */}
      {[[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].map(([bx,by,sx,sy],i)=>(
        <g key={i}>
          <line x1={bx} y1={by} x2={bx+sx*11} y2={by}      stroke={c.stroke} strokeWidth="2.2"/>
          <line x1={bx} y1={by} x2={bx}        y2={by+sy*11} stroke={c.stroke} strokeWidth="2.2"/>
        </g>
      ))}
      {/* labels */}
      {lines.map((l,i) => (
        <text key={i} x={cx} y={cy+(lines.length===1?5:(i-.5)*13+5)}
          textAnchor="middle" fill={c.text}
          fontSize={i===0?10:9} fontFamily="JetBrains Mono,monospace"
          fontWeight={i===0?700:400} letterSpacing=".07em">{l}</text>
      ))}
    </g>
  );
}

/* ── SVG edge ────────────────────────────────────────────── */
function SEdge({ a, b, lab, active }) {
  const na = NODES[a], nb = NODES[b];
  const on = active.has(a) && active.has(b);
  const col = on ? (EDGE_COL[NODES[b].kind] || '#00e5ff') : 'rgba(14,40,58,.5)';
  const x1=na.cx, y1=na.cy+na.h/2, x2=nb.cx, y2=nb.cy-nb.h/2;
  const d=(y2-y1)*.45;
  const path=`M${x1} ${y1} C${x1} ${y1+d},${x2} ${y2-d},${x2} ${y2}`;

  return (
    <g>
      <defs>
        <marker id={`m${a}${b}`} markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
          <path d="M0 0 L7 3.5 L0 7z" fill={col} opacity={on?.9:.3}/>
        </marker>
      </defs>
      <path d={path} stroke={col} strokeWidth={on?1.5:.5} fill="none"
        strokeDasharray={on?'6 4':'3 6'}
        className={on?'edge-flow':''}
        markerEnd={`url(#m${a}${b})`}
        opacity={on?.85:.35}/>
      {lab && on && (
        <text x={(x1+x2)/2+(x2>x1?8:-8)} y={(y1+y2)/2}
          textAnchor={x2>x1?'start':'end'} dominantBaseline="middle"
          fill={col} fontSize="8" fontFamily="JetBrains Mono" opacity=".8">{lab}</text>
      )}
    </g>
  );
}

/* ── wire from left panel ────────────────────────────────── */
function Wire({ q, ans, active }) {
  const tgt = NODES[q.target];
  const on  = ans !== undefined && ans !== null;
  const col = !on ? 'rgba(0,70,110,.2)'
            : (q.flag && ans==='sim' ? '#ff2d55' : '#00e5ff');
  const x2  = tgt.cx - tgt.w/2;
  const y2  = tgt.cy;
  const mx  = x2 / 2;
  const wy  = (QS.indexOf(q) + .7) * 73;

  return (
    <path
      d={`M0 ${wy} C${mx*.55} ${wy},${mx*1.15} ${y2},${x2} ${y2}`}
      stroke={col} strokeWidth={on?1.3:.4} fill="none"
      strokeDasharray="5 4"
      className={on?'edge-flow':''}
      opacity={on?.65:.2}/>
  );
}

/* ── question card ───────────────────────────────────────── */
function QCard({ q, ans, onAns }) {
  const fc = q.flag ? '#ff2d55' : '#00e5ff';
  const answered = ans !== undefined && ans !== null;
  const borderCol = !answered ? 'rgba(0,229,255,.08)'
    : ans==='sim' ? (q.flag?'rgba(255,45,85,.4)':'rgba(0,229,255,.32)')
    : 'rgba(255,45,85,.2)';

  return (
    <div className="fade-in" style={{
      marginBottom:10, padding:'10px 14px 10px 14px',
      background:'rgba(5,12,24,.85)',
      border:`1px solid ${borderCol}`,
      borderRadius:6, position:'relative',
      transition:'border-color .2s',
    }}>
      {/* code pill */}
      <div style={{
        position:'absolute', top:-1, left:12,
        background:'#050810', padding:'0 6px',
        fontSize:9, fontWeight:700, letterSpacing:'.1em', color:fc,
        borderLeft:`1px solid ${fc}`, borderRight:`1px solid ${fc}`,
      }}>{q.code}</div>
      {/* connector dot */}
      <div style={{
        position:'absolute', right:-4, top:'50%', transform:'translateY(-50%)',
        width:7, height:7, borderRadius:'50%',
        background: answered ? (q.flag&&ans==='sim'?'#ff2d55':'#00e5ff') : 'rgba(0,70,110,.4)',
        boxShadow: answered ? `0 0 7px ${q.flag&&ans==='sim'?'#ff2d55':'#00e5ff'}` : 'none',
        transition:'all .2s',
      }}/>

      <div style={{fontSize:11,fontWeight:500,color:'#c0ddf0',marginTop:5,marginBottom:5,lineHeight:1.4}}>
        {q.label}
      </div>
      <div style={{fontSize:9,color:q.flag?'rgba(255,80,100,.65)':'rgba(0,180,230,.45)',marginBottom:8,letterSpacing:'.06em'}}>
        {q.hint}
      </div>
      <div style={{display:'flex',gap:8}}>
        <button className={`btn btn-sim${ans==='sim'?' on':''}`}
          onClick={()=>onAns(q.id, ans==='sim'?null:'sim')}>▶ SIM</button>
        <button className={`btn btn-nao${ans==='nao'?' on':''}`}
          onClick={()=>onAns(q.id, ans==='nao'?null:'nao')}>▶ NÃO</button>
      </div>
    </div>
  );
}

/* ── score bar ───────────────────────────────────────────── */
function ScoreBar({ score, diag }) {
  const pct = Math.min(score/13*100, 100);
  const barCol = score>=8?'#00ff87':score>=4?'#ffd60a':'#b388ff';
  const diagCol = diag ? (KIND[diag.kind]||KIND.cyan).text : 'rgba(0,229,255,.3)';

  return (
    <div style={{marginTop:14,padding:'12px 14px',background:'rgba(0,229,255,.03)',border:'1px solid rgba(0,229,255,.1)',borderRadius:6}}>
      <div style={{fontSize:9,color:'rgba(0,229,255,.35)',letterSpacing:'.16em',marginBottom:8}}>DIAGNÓSTICO ATIVO</div>
      {diag ? (
        <div className="fade-in" style={{fontSize:11,fontWeight:700,color:diagCol,letterSpacing:'.05em',marginBottom:8,textShadow:`0 0 10px ${diagCol}`}}>
          {diag.text}
        </div>
      ) : (
        <div style={{fontSize:10,color:'rgba(0,180,220,.3)',letterSpacing:'.1em',marginBottom:8}}>
          — AGUARDANDO INPUT —<span className="blink">_</span>
        </div>
      )}
      {score > 2 && (
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:9,color:'rgba(0,229,255,.4)',minWidth:42}}>DUTCH</span>
          <div style={{flex:1,height:4,background:'rgba(0,229,255,.1)',borderRadius:2,overflow:'hidden'}}>
            <div style={{
              height:'100%', width:`${pct}%`,
              background:barCol,
              boxShadow:`0 0 6px ${barCol}`,
              borderRadius:2,
              transition:'width .4s ease, background .3s ease',
            }}/>
          </div>
          <span style={{fontSize:10,fontWeight:700,color:barCol,minWidth:40}}>{score.toFixed(1)}/13</span>
        </div>
      )}
    </div>
  );
}

/* ── SOAP mock generator ─────────────────────────────────── */
function buildSOAP(ans, diag, score) {
  if (!diag) return null;

  const positivos = [];
  if (ans.mtf1  === 'sim') positivos.push('1ª articulação metatarsofalangeana afetada (podagra)');
  if (ans.prev  === 'sim') positivos.push('Ataque articular semelhante prévio');
  if (ans.verm  === 'sim') positivos.push('Vermelhidão articular presente');
  if (ans.hascv === 'sim') positivos.push('HAS / doença cardiovascular');
  if (ans.ini1d === 'sim') positivos.push('Início em menos de 24 horas');
  if (ans.urato === 'sim') positivos.push('Ácido úrico sérico > 5,88 mg/dL');

  const isFlag = ans.rf === 'sim';

  return {
    subjetivo: isFlag
      ? 'Paciente com artrite aguda associada a febre ≥ 38,5°C e/ou aparência tóxica.'
      : `Paciente com artrite aguda monoarticular${ans.mtf1==='sim' ? ' em 1ª MTF (podagra)' : ''}.${ans.ini1d==='sim' ? ' Início em < 24h.' : ''}${ans.prev==='sim' ? ' Ataques prévios semelhantes.' : ''}`,

    objetivo: isFlag
      ? 'Articulação quente, eritematosa, com dor intensa à mobilização. Febre presente.'
      : `Articulação${ans.verm==='sim' ? ' eritematosa' : ''} com edema e dor à mobilização. Sem sinais de instabilidade.`,

    analise: isFlag
      ? '⚠️ Artrite séptica a excluir — CID: M00.9. Febre + artrite aguda: risco de sepse articular. Gota e infecção podem coexistir.'
      : `${diag.text} — CID: ${score>=8?'M10.9':'M10.9'}.\nAchados positivos (Dutch 2010): ${positivos.length ? positivos.join('; ') + '.' : 'nenhum registrado.'}`,

    plano: isFlag
      ? '• Punção articular urgente (diagnóstica e terapêutica)\n• Hemograma + PCR + hemocultura\n• NÃO iniciar colchicina ou AINE sem excluir artrite séptica\n• Encaminhar PS imediato'
      : score >= 8
        ? '• Colchicina 1,2 mg VO agora + 0,6 mg após 1h; manutenção 0,6 mg 1-2×/dia × 7-10 dias\n• Alt.: Naproxeno 500 mg 12/12h × 5-7 dias (se sem DRC/anticoag)\n• Gelo local 20-30 min, 3-4×/dia\n• ULT: Alopurinol 100 mg/dia após resolução (indicação forte: ≥ 2 ataques/ano)\n• Urato sérico 4-6 semanas após o flare\n• Dieta: evitar vísceras, frutos do mar, cerveja, frutose'
        : score >= 4
          ? '• Tratar o ataque: colchicina dose de ataque\n• Coletar urato sérico 2-4 semanas após o flare (pode estar falsamente baixo durante)\n• RX articular: pesquisar erosão com borda esclerótica\n• Reavaliação diagnóstica com labs'
          : '• Gota improvável — investigar pseudogota, artrite reativa ou artrite reumatoide\n• Solicitar: urato sérico, hemograma, PCR, VHS, FR, anti-CCP\n• RX articular: calcificação cartilaginosa (pseudogota/CPPD)',
  };
}

/* ── SOAP panel ──────────────────────────────────────────── */
function SOAPPanel({ soap, diag, onClose }) {
  if (!soap) return null;
  const diagCol = diag ? (KIND[diag.kind]||KIND.cyan).text : '#00e5ff';

  const Section = ({ label, text, col='rgba(0,229,255,.5)' }) => (
    <div style={{marginBottom:14}}>
      <div style={{fontSize:9,letterSpacing:'.18em',color:col,marginBottom:5,
        borderBottom:`1px solid ${col}30`,paddingBottom:3}}>
        #{label}
      </div>
      <div style={{fontSize:11,lineHeight:1.6,color:'#c8e4f0',whiteSpace:'pre-line'}}>
        {text}
      </div>
    </div>
  );

  return (
    <div className="fade-in" style={{
      position:'absolute', inset:0, zIndex:50,
      background:'rgba(3,6,14,.97)',
      backdropFilter:'blur(8px)',
      padding:'20px 24px',
      overflowY:'auto',
      borderLeft:'1px solid rgba(0,229,255,.15)',
    }}>
      {/* header */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div>
          <div style={{fontFamily:'Orbitron,monospace',fontSize:11,color:'rgba(0,229,255,.5)',letterSpacing:'.15em'}}>
            PRONTUÁRIO GERADO
          </div>
          <div style={{fontSize:12,fontWeight:700,color:diagCol,marginTop:4,
            textShadow:`0 0 10px ${diagCol}`}}>
            {diag?.text}
          </div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button onClick={() => navigator.clipboard.writeText(
            `#Subjetivo:\n${soap.subjetivo}\n\n#Objetivo:\n${soap.objetivo}\n\n#Análise:\n${soap.analise}\n\n#Plano:\n${soap.plano}`
          )} style={{
            padding:'5px 14px', fontSize:9, letterSpacing:'.1em',
            background:'rgba(0,229,255,.08)', border:'1px solid rgba(0,229,255,.3)',
            borderRadius:4, color:'#00e5ff', cursor:'pointer',
            fontFamily:'JetBrains Mono,monospace',
          }}>⎘ COPIAR</button>
          <button onClick={onClose} style={{
            padding:'5px 14px', fontSize:9, letterSpacing:'.1em',
            background:'rgba(255,45,85,.06)', border:'1px solid rgba(255,45,85,.25)',
            borderRadius:4, color:'rgba(255,45,85,.7)', cursor:'pointer',
            fontFamily:'JetBrains Mono,monospace',
          }}>✕ FECHAR</button>
        </div>
      </div>

      <div style={{height:1,background:'linear-gradient(90deg,rgba(0,229,255,.3),transparent)',marginBottom:16}}/>

      <Section label="Subjetivo"  text={soap.subjetivo} col='rgba(0,229,255,.55)'/>
      <Section label="Objetivo"   text={soap.objetivo}  col='rgba(0,229,255,.45)'/>
      <Section label="Análise"    text={soap.analise}   col={diagCol}/>
      <Section label="Plano"      text={soap.plano}     col='rgba(0,255,135,.55)'/>

      <div style={{marginTop:8,fontSize:9,color:'rgba(0,229,255,.2)',letterSpacing:'.1em'}}>
        Gerado por SymptoPy v2.0.31 // Dutch 2010 // ACR 2020 // EULAR 2022
      </div>
    </div>
  );
}

/* ── App ─────────────────────────────────────────────────── */
function App() {
  const [ans, setAns] = useState({});
  const [showSoap, setShowSoap] = useState(false);

  const onAns = useCallback((id, val) => {
    setAns(p => val===null ? {...p, [id]:undefined} : {...p, [id]:val});
    setShowSoap(false);
  }, []);

  const { active, score, diag } = useMemo(() => compute(ans), [ans]);
  const answered = Object.values(ans).filter(Boolean).length;
  const showScore = ans.rf === 'nao';
  const soap = useMemo(() => buildSOAP(ans, diag, score), [ans, diag, score]);

  return (
    <div style={{height:'100%',display:'flex',flexDirection:'column'}}>

      {/* ── HEADER */}
      <header style={{
        borderBottom:'1px solid rgba(0,229,255,.12)',
        background:'rgba(4,8,18,.95)',
        padding:'9px 22px',
        display:'flex', alignItems:'center', justifyContent:'space-between',
        flexShrink:0,
      }}>
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <span style={{fontFamily:'Orbitron,monospace',fontWeight:900,fontSize:17,color:'#00e5ff',
            textShadow:'0 0 18px #00e5ff, 0 0 40px rgba(0,229,255,.35)',letterSpacing:'.14em'}}>
            SYMPTOPY
          </span>
          <span style={{width:1,height:18,background:'rgba(0,229,255,.2)',display:'block'}}/>
          <span style={{fontFamily:'Orbitron,monospace',fontSize:9,color:'rgba(0,229,255,.5)',letterSpacing:'.12em'}}>
            MOTOR DIAGNÓSTICO
          </span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:18,fontSize:9,color:'rgba(0,180,220,.45)',letterSpacing:'.1em'}}>
          <span>MODULE <span style={{color:'#00e5ff',fontWeight:600}}>GOTA / ARTRITE POR CRISTAIS</span></span>
          <span style={{color:'rgba(0,229,255,.25)'}}>|</span>
          <span style={{color:answered?'#00e5ff':'rgba(0,180,220,.35)'}}>{answered}/{QS.length} INPUTS</span>
          <span style={{color:'rgba(0,229,255,.25)'}}>|</span>
          <span style={{color:'#00ff87'}}>● ONLINE</span>
        </div>
      </header>

      {/* ── MAIN */}
      <div style={{flex:1,display:'flex',overflow:'hidden'}}>

        {/* LEFT: Questions */}
        <div style={{
          width:365, flexShrink:0,
          background:'rgba(4,9,20,.88)',
          borderRight:'1px solid rgba(0,229,255,.1)',
          overflowY:'auto', padding:'14px 14px 14px 16px',
          position:'relative',
        }}>
          {/* top corner brackets */}
          <div style={{position:'absolute',top:0,left:0,width:12,height:12,
            borderTop:'2px solid rgba(0,229,255,.5)',borderLeft:'2px solid rgba(0,229,255,.5)'}}/>
          <div style={{position:'absolute',top:0,right:0,width:12,height:12,
            borderTop:'2px solid rgba(0,229,255,.5)',borderRight:'2px solid rgba(0,229,255,.5)'}}/>

          <div style={{marginBottom:12}}>
            <div style={{fontSize:9,color:'rgba(0,229,255,.35)',letterSpacing:'.18em',marginBottom:5}}>
              INVESTIGAÇÃO DIAGNÓSTICA
            </div>
            <div style={{height:1,background:'linear-gradient(90deg,rgba(0,229,255,.4),transparent)'}}/>
          </div>

          {QS.map(q => <QCard key={q.id} q={q} ans={ans[q.id]} onAns={onAns}/>)}

          <ScoreBar score={score} diag={diag}/>

          {diag && (
            <button onClick={() => setShowSoap(s => !s)} className="fade-in" style={{
              marginTop:10, width:'100%', padding:'8px',
              fontSize:10, letterSpacing:'.1em', fontWeight:700,
              background: showSoap ? 'rgba(0,229,255,.12)' : 'rgba(0,229,255,.06)',
              border:`1px solid ${showSoap ? 'rgba(0,229,255,.6)' : 'rgba(0,229,255,.25)'}`,
              borderRadius:4, color: showSoap ? '#00e5ff' : 'rgba(0,229,255,.7)',
              cursor:'pointer', fontFamily:'JetBrains Mono,monospace',
              boxShadow: showSoap ? '0 0 12px rgba(0,229,255,.3)' : 'none',
              transition:'all .2s',
            }}>
              {showSoap ? '← VOLTAR AO GRAFO' : '▶ GERAR PRONTUÁRIO'}
            </button>
          )}

          {answered > 0 && (
            <button onClick={() => { setAns({}); setShowSoap(false); }} style={{
              marginTop:8, width:'100%', padding:'6px',
              fontSize:9, letterSpacing:'.1em',
              background:'transparent', border:'1px solid rgba(255,45,85,.2)',
              borderRadius:4, color:'rgba(255,45,85,.45)', cursor:'pointer',
              fontFamily:'JetBrains Mono,monospace', transition:'all .2s',
            }}
            onMouseEnter={e=>{e.target.style.borderColor='rgba(255,45,85,.5)';e.target.style.color='#ff2d55';}}
            onMouseLeave={e=>{e.target.style.borderColor='rgba(255,45,85,.2)';e.target.style.color='rgba(255,45,85,.45)';}}>
              ↺ REINICIAR
            </button>
          )}
        </div>

        {/* RIGHT: Tree or SOAP */}
        <div style={{flex:1,background:'rgba(3,7,16,.65)',position:'relative',overflow:'hidden'}}>
          {/* SOAP overlay */}
          {showSoap && soap && (
            <SOAPPanel soap={soap} diag={diag} onClose={() => setShowSoap(false)}/>
          )}
          <div style={{position:'absolute',top:10,left:14,fontSize:9,color:'rgba(0,229,255,.25)',letterSpacing:'.18em',zIndex:5}}>
            ÁRVORE DIAGNÓSTICA // DUTCH 2010
          </div>
          <div style={{position:'absolute',top:10,right:14,fontSize:9,color:'rgba(0,229,255,.25)',letterSpacing:'.1em',zIndex:5}}>
            {active.size}/{Object.keys(NODES).length} NÓDULOS ATIVOS
          </div>

          <svg viewBox="0 0 720 460" preserveAspectRatio="xMidYMid meet"
            style={{width:'100%',height:'100%',display:'block'}}>

            {/* micro grid inside SVG */}
            <defs>
              <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
                <path d="M24 0L0 0 0 24" fill="none" stroke="rgba(0,229,255,.025)" strokeWidth=".5"/>
              </pattern>
            </defs>
            <rect width="720" height="460" fill="url(#g)"/>

            {/* wires from left panel */}
            {QS.map(q => <Wire key={q.id} q={q} ans={ans[q.id]} active={active}/>)}

            {/* edges */}
            {EDGES.map((e,i) => <SEdge key={i} {...e} active={active}/>)}

            {/* nodes */}
            {Object.entries(NODES).map(([id,n]) =>
              <SNode key={id} id={id} node={n} on={active.has(id)}/>
            )}
          </svg>
        </div>
      </div>

      {/* ── FOOTER */}
      <footer style={{
        borderTop:'1px solid rgba(0,229,255,.07)',
        background:'rgba(3,6,14,.95)',
        padding:'4px 22px',
        display:'flex', alignItems:'center', justifyContent:'space-between',
        flexShrink:0, fontSize:8, letterSpacing:'.12em',
        color:'rgba(0,229,255,.2)',
      }}>
        <span>SYMPTOPY v2.0.31 // DUTCH 2010 // ACR 2020 // EULAR 2022</span>
        <span>31 MÓDULOS // CID-10 100% // PT-BR<span className="blink" style={{color:'rgba(0,229,255,.4)'}}>_</span></span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
